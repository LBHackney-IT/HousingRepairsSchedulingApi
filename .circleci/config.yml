version: 2.1

orbs:
  aws_assume_role: lbh-hackit/aws_assume_role@0.1.0

executors:
  docker-python:
    docker:
      - image: cimg/python:3.7
  docker-terraform:
    docker:
      - image: "hashicorp/terraform:light"
  docker-dotnet:
    docker:
      - image: mcr.microsoft.com/dotnet/sdk:8.0

references:
  workspace_root: &workspace_root "~"
  attach_workspace: &attach_workspace
    attach_workspace:
      at: *workspace_root

commands:
  assume-role-and-persist-workspace:
    description: "Assumes deployment role and persists credentials across jobs"
    parameters:
      aws-account:
        type: string
    steps:
      - checkout
      - aws_assume_role/assume_role:
          account: <<parameters.aws-account>>
          profile_name: default
          role: "LBH_Circle_CI_Deployment_Role"
      - persist_to_workspace:
          root: *workspace_root
          paths:
            - .aws
  authenticate-nuget:
    parameters:
      hackney-nuget-username:
        type: string
        default: $HACKNEY_NUGET_USERNAME
      hackney-nuget-password:
        type: string
        default: $LBHPACKAGESTOKEN
    steps:
      - run:
          name: Add Nuget Source
          command: dotnet nuget add source --username <<parameters.hackney-nuget-username>> --password  <<parameters.hackney-nuget-password>>  --store-password-in-clear-text --name github "https://nuget.pkg.github.com/LBHackney-IT/index.json"
  deploy-lambda:
    description: "Deploys API via Serverless"
    parameters:
      stage:
        type: string
    steps:
      - *attach_workspace
      - checkout
      - setup_remote_docker
      - run:
          name: Install Node.js
          command: |
            curl -sL https://deb.nodesource.com/setup_20.x | bash -
            apt-get update && apt-get install -y nodejs
      - run:
          name: Install serverless CLI
          command: npm i -g serverless
      - run:
          name: Build lambda
          command: |
            cd ./HousingRepairsSchedulingApi/
            chmod +x ./build.sh
            ./build.sh
      - run:
          name: Deploy lambda
          command: |
            cd ./HousingRepairsSchedulingApi/
            npx --yes serverless@^4 deploy --stage <<parameters.stage>> --conceal

  terraform-init-then-apply:
    description: "Initializes and applies terraform configuration"
    parameters:
      environment:
        type: string
    steps:
      - *attach_workspace
      - checkout
      - run:
          command: |
            cd ./terraform/<<parameters.environment>>/
            terraform get -update=true
            terraform init
          name: get and init
      - run:
          name: apply
          command: |
            cd ./terraform/<<parameters.environment>>/
            terraform apply -auto-approve

jobs:
  deploy-to-dr:
    executor: docker-dotnet
    steps:
      - authenticate-nuget
      - deploy-lambda:
          stage: "production"
  assume-role-dr:
    executor: docker-python
    steps:
      - assume-role-and-persist-workspace:
          aws-account: $AWS_ACCOUNT_DISASTER_RECOVERY
  terraform-init-and-apply-to-dr:
    executor: docker-terraform
    steps:
      - terraform-init-then-apply:
          environment: "production"
          
workflows:
  deploy-dr:
    jobs:
      - assume-role-dr:
          context: api-assume-role-disaster-recovery-context
      - terraform-init-and-apply-to-dr:
          requires:
            - assume-role-dr
      - deploy-to-dr:
          context:
            - api-nuget-token-context
            - "Serverless Framework"
          requires:
            - terraform-init-and-apply-to-dr
