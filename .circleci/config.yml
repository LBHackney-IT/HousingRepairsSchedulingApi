version: 2.1

orbs:
  aws_assume_role: lbh-hackit/aws_assume_role@0.1.0

executors:
  docker-python:
    docker:
      - image: cimg/python:3.7
  docker-terraform:
    docker:
      - image: "hashicorp/terraform:light"
  docker-dotnet:
    docker:
      - image: mcr.microsoft.com/dotnet/sdk:8.0

references:
  workspace_root: &workspace_root "~"
  attach_workspace: &attach_workspace
    attach_workspace:
      at: *workspace_root

commands:
  assume-role-and-persist-workspace:
    description: "Assumes deployment role and persists credentials across jobs"
    parameters:
      aws-account:
        type: string
    steps:
      - checkout
      - aws_assume_role/assume_role:
          account: <<parameters.aws-account>>
          profile_name: default
          role: "LBH_Circle_CI_Deployment_Role"
      - persist_to_workspace:
          root: *workspace_root
          paths:
            - .aws

  terraform-init-then-destroy:
    description: "Initializes and destroys terraform infrastructure"
    parameters:
      environment:
        type: string
    steps:
      - *attach_workspace
      - checkout
      - run:
          command: |
            cd ./terraform/<<parameters.environment>>/
            terraform get -update=true
            terraform init
          name: get and init
      - run:
          name: destroy
          command: |
            cd ./terraform/<<parameters.environment>>/
            terraform destroy -auto-approve

  remove-lambda:
    description: "Removes API via Serverless"
    parameters:
      stage:
        type: string
    steps:
      - *attach_workspace
      - checkout
      - setup_remote_docker
      - run:
          name: Install Node.js
          command: |
            curl -sL https://deb.nodesource.com/setup_20.x | bash -
            apt-get update && apt-get install -y nodejs
      - run:
          name: Install serverless CLI
          command: npm i -g serverless
      - run:
          name: Remove lambda
          command: |
            cd ./HousingRepairsSchedulingApi/
            npx --yes serverless@^4 remove --stage <<parameters.stage>> --conceal

jobs:
  assume-role-dr:
    executor: docker-python
    steps:
      - assume-role-and-persist-workspace:
          aws-account: $AWS_ACCOUNT_DISASTER_RECOVERY

  terraform-destroy-dr:
    executor: docker-terraform
    steps:
      - terraform-init-then-destroy:
          environment: "production"

  remove-lambda-dr:
    executor: docker-dotnet
    steps:
      - remove-lambda:
          stage: "production"

workflows:
  teardown-dr:
    jobs:
      - assume-role-dr:
          context: api-assume-role-disaster-recovery-context
      - terraform-destroy-dr:
          requires:
            - assume-role-dr
      - remove-lambda-dr:
          context:
            - api-nuget-token-context
            - "Serverless Framework"
          requires:
            - terraform-destroy-dr